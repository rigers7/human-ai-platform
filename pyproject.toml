[project]
name = "human-ai-platform"
version = "0.1.0"
description = "Full-stack Human AI Platform with React, FastAPI, Supabase, and Mistral AI"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.121.0",
    "langchain-mistralai>=0.1.0",  # Added for Mistral API
    "langchain-ollama>=1.0.0",
    "langgraph>=1.0.2",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "supabase>=2.24.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.38.0",
]
